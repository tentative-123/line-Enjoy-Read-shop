server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  location = /healthz {
    access_log off;
    add_header Content-Type text/plain;
    add_header Cache-Control "no-store";
    return 200 "ok\n";
  }

  # HTML must never be cached across Railway deployments. Hashed JS/CSS assets
  # remain immutable below, but caching login.html can mix an old Japanese page
  # with a newly deployed JavaScript bundle.
  location = /login {
    add_header Cache-Control "no-store, no-cache, must-revalidate";
    add_header Pragma "no-cache";
    add_header Expires "0";
    try_files /login.html /index.html;
  }

  location ~* \.html$ {
    add_header Cache-Control "no-store, no-cache, must-revalidate";
    add_header Pragma "no-cache";
    add_header Expires "0";
    try_files $uri =404;
  }

  location / {
    add_header Cache-Control "no-store, no-cache, must-revalidate";
    try_files $uri $uri.html $uri/ /index.html;
  }

  location ~* \.(?:js|css|png|jpg|jpeg|gif|svg|ico|woff2?)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }
}
